<style>
        .neumorphic-card {
            background-color: #1F2937;
            box-shadow: -8px -8px 20px rgba(43, 57, 77, 0.5), 8px 8px 20px #131a23;
            border-radius: 24px;
        }
        .inset-input {
            background-color: #111827;
            box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.4), inset -4px -4px 8px rgba(255, 255, 255, 0.05);
            border-radius: 16px;
        }
        .text-glow-teal {
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-[#111827] font-body text-on-surface min-h-screen flex flex-col items-center justify-center p-6">
<!-- Login Container -->
<main class="w-full max-w-md flex flex-col items-center gap-8">
<!-- Neumorphic Login Card -->
<div class="neumorphic-card w-full p-10 flex flex-col items-center">
<!-- Brand Logo / Name -->
<img alt="Gommies Mascot" class="h-24 w-auto mb-4" src="https://lh3.googleusercontent.com/aida/ADBb0uhmkw4PTrRN7hV8LGB_8qH0pfMrtvhsD9opDQHdjn6r3FEpiXKZLOA672ISA_NZSO3_ilOCFAdGPJoF-vWUAGFYwKyGBT9eRdqrDYS_QFnBwqH_xRlrHivnloGPmp5ANAmDOsa7Sh8wl0r2pSSM6B3XpEcDkX_cfMqOqbcvLv4l6HdPjhu0_XiLyNx7qZIRvbihOhKl3SMHd0LiT4kQuXt13A5QxsJZIx7HO8QVHvzBRbMI5Y1xR0iemjstAS7zfX1J6dVCAV0qLw"/><img alt="GOMMIES Logo" class="h-12 w-auto mb-2" src="https://lh3.googleusercontent.com/aida/ADBb0uhpecI6m40utvjJ1Q2szlvM6gzS0oeKhnlTDqeN7CZjAfBwGzRndW1akgqofdVoPARgsUM9mtIEZTkVC8dYwDt9VjMnoMSC3k2sP90Ak7DsmgW5NPIJv4PMfgUt3GjOkJIbZmYlWVJYu1qyESefqQKCd84pJgjMCNXHsHqLjdO9z_2PWVxvGlGEp1fjRNvNTDnqSOUFEb-n5f92QsBUbvse0JH5T7bOa6NM3vB0C4ysUgfQIRzdJGsw7zxdQEnZOew9p7qlmETwgg"/>
<!-- Subtitle -->
<p class="text-[#94A3B8] font-body text-sm mb-10 tracking-tight">
                Sign in with student email
            </p>
<!-- Form Content -->
<div class="w-full space-y-6">
<!-- Email Entry Field -->
<div class="relative w-full group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-[#64748B]">
<span class="material-symbols-outlined text-lg">alternate_email</span>
</div>
<input class="inset-input w-full py-4 pl-12 pr-4 border-none text-[#dce2f7] placeholder-[#94A3B8] focus:ring-2 focus:ring-[#0D9488]/50 transition-all font-mono text-sm" placeholder="Enter student email" type="email"/>
</div>
<!-- Action Button -->
<button class="w-full bg-[#0D9488] hover:bg-[#10B981] text-white font-mono font-black py-4 rounded-[16px] tracking-widest uppercase transition-all active:scale-95 shadow-lg shadow-[#0D9488]/20">
                    SEND CODE
                </button>
<!-- Back Link -->
<div class="flex justify-center pt-2">
<a class="text-[#64748B] hover:text-[#dce2f7] text-xs font-mono tracking-wide transition-colors flex items-center gap-2" href="#">
<span class="material-symbols-outlined text-sm">arrow_back_ios</span>
                        Wrong email? Go back
                    </a>
</div>
</div>
</div>
<!-- Dev Mode Toggle Footer -->
<div class="w-full flex items-center justify-center gap-4 py-4 border-t border-[#3d4947]/20 mt-4">
<span class="text-[#64748B] font-mono text-[10px] tracking-[0.2em] uppercase">Dev Mode</span>
<button class="relative inline-flex h-5 w-10 shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-[#1F2937] transition-colors duration-200 focus:outline-none ring-1 ring-[#3d4947]">
<span class="translate-x-0 pointer-events-none inline-block h-4 w-4 transform rounded-full bg-[#64748B] shadow ring-0 transition duration-200"></span>
</button>
</div>
</main>
<!-- Decoration / Ambient Background Elements -->
<div class="fixed top-[-10%] right-[-10%] w-[500px] h-[500px] bg-[#6bd8cb]/5 blur-[120px] rounded-full -z-10 pointer-events-none"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[400px] h-[400px] bg-[#4edea3]/5 blur-[100px] rounded-full -z-10 pointer-events-none"></div>
