</div>
</section>
<!-- Section 2: Duration Limit -->

                    Duration Limit

<button class="bg-[#070e1d] border border-outline-variant/30 py-3 rounded-full font-jetbrains text-[0.75rem] hover:bg-[#232a3a] transition-all">
                        15m

<button class="bg-[#002c22] border-2 border-secondary py-3 rounded-full font-jetbrains text-[0.75rem] text-secondary font-bold shadow-[0_0_15px_rgba(78,222,163,0.2)]">
                        25m
                    </button>
<button class="bg-[#070e1d] border border-outline-variant/30 py-3 rounded-full font-jetbrains text-[0.75rem] hover:bg-[#232a3a] transition-all">
                        45m

</div>
</section>
